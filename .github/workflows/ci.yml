name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run skills:validate
      - run: npm test
        env:
          CHAMBER_SNAPSHOT_PATH: fixtures/chamber/synthetic-snapshot.json
      - run: npm run build
